name: "Monitor de Preços de Hardware"

on:
  schedule:
    # Roda a cada 4 horas automaticamente
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite rodar manualmente com 1 clique no GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite salvar o history.json

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Monitoramento de Preços
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python tracker.py

      - name: Salvar Histórico de Preços
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: atualiza historico de precos [skip ci]" || true
          git push || true
