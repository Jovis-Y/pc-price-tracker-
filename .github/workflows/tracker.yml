name: "Monitor de Preços de Hardware"

on:
  schedule:
    # Executa a cada 4 horas (0h, 4h, 8h, 12h, 16h, 20h UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Permite rodar manualmente a qualquer momento no GitHub

jobs:
  check-prices:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permite salvar o histórico (history.json)

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar Monitoramento de Preços
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tracker.py

      - name: Salvar Histórico de Preços
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json || true
          git commit -m "chore: atualiza histórico de preços [skip ci]" || true
          git push || true
